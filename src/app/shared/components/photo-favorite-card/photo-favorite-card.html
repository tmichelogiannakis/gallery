<button
  type="button"
  class="photo-card"
  [class.photo-card-favorite]="isFavorite()"
  [class.photo-card-interactive]="!isFavorite()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-disabled]="isFavorite() ? 'true' : null"
  (click)="handleCardClick()"
>
  <app-photo-card-body [photo]="photo()" [priority]="priority()">
    @if (isFavorite()) {
      <span class="favorite-badge">
        <mat-icon aria-hidden="true" fontIcon="favorite"></mat-icon>
      </span>
    }
  </app-photo-card-body>
</button>
