<button
  type="button"
  class="photo-card"
  [class.photo-card-favorite]="isFavorite()"
  [attr.aria-label]="favoriteLabel()"
  [attr.aria-disabled]="isFavorite() ? 'true' : null"
  (click)="handleItemClick()"
>
  <div class="thumbnail-wrapper">
    @if (isFavorite()) {
      <span class="favorite-badge">
        <mat-icon aria-hidden="true" fontIcon="favorite"></mat-icon>
      </span>
    }
    <img
      [ngSrc]="photo().id"
      fill
      ngSrcset="200w, 400w, 600w"
      sizes="200px"
      [priority]="priority()"
      placeholder
      [loaderParams]="imageLoaderParams"
      [alt]="altText()"
      class="thumbnail-img"
    />
  </div>
  <div class="card-details">
    <span class="author-name">{{ photo().author }}</span>
    <span class="dimensions-meta">{{ dimensionsText() }}</span>
  </div>
</button>
