<div class="favorites-container">
  <app-photo-grid>
    @for (photo of photos(); track photo.id; let i = $index) {
      <app-photo-grid-item
        [photo]="photo"
        [priority]="i < 10"
        (photoSelected)="navigateToPhotoDetails($event)"
      />
    }
  </app-photo-grid>

  @if (status() === 'loading') {
    <app-loading-indicator ariaLabel="Loading favorites" />
  }

  @if (status() === 'error') {
    <app-alert variant="error" message="Something went wrong while loading your favorites.">
      <button matButton="filled" type="button" (click)="loadFavorites()">Try again</button>
    </app-alert>
  }

  @if (isEmpty()) {
    <app-alert message="You have not added any photos to your favorites yet." />
  }
</div>
