<div class="favorites-container">
  <h1 class="visually-hidden">Favorites</h1>

  @if (favoritesStore.error(); as favoritesError) {
    <app-alert variant="error" [message]="favoritesError" />
  }

  <app-photo-grid>
    @for (photo of favoritesStore.photos(); track photo.id; let i = $index) {
      <app-photo-grid-item [photo]="photo" [priority]="i < 10" [link]="['/photos', photo.id]" />
    }
  </app-photo-grid>

  @if (favoritesStore.status() === 'error') {
    <app-alert variant="error" message="Something went wrong while loading your favorites.">
      <button matButton="filled" type="button" (click)="reloadFavorites()">Try again</button>
    </app-alert>
  }

  @if (isEmpty()) {
    <app-alert message="You have not added any photos to your favorites yet." />
  }
</div>
