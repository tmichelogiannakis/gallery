<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" class="cancel-button" [matDialogClose]="false">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>
  <button
    matButton="filled"
    type="button"
    class="confirm-button"
    [matDialogClose]="true"
    cdkFocusInitial
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
