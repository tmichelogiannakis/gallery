<div class="photo-stream-container">
  <h1 class="visually-hidden">Photo stream</h1>

  @if (favoritesStore.error(); as favoritesError) {
    <app-alert variant="error" [message]="favoritesError" />
  }

  <p class="visually-hidden" role="status">{{ announcement() }}</p>

  <div appPhotoGrid [attr.aria-busy]="status() === 'loading'">
    @for (photo of photos(); track photo.id; let i = $index) {
      <app-photo-grid-item
        [photo]="photo"
        [priority]="i < 10"
        [isFavorite]="favoritesStore.isFavorite(photo.id)"
        (photoSelected)="addPhotoToFavorites($event)"
      />
    }
  </div>

  @if (status() === 'loading') {
    <app-loading-indicator ariaLabel="Loading more photos" />
  }

  @if (status() === 'error') {
    <app-alert variant="error" message="Something went wrong while loading photos.">
      <button matButton="filled" type="button" (click)="retryFailedPage()">Try again</button>
    </app-alert>
  }

  @if (canLoadMore()) {
    <div
      class="photo-stream-page-bottom"
      aria-hidden="true"
      appOnVisible
      (visible)="loadNextPage()"
    ></div>
  }
</div>
